services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: quota
      POSTGRES_USER: quota
      POSTGRES_PASSWORD: quota
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/quota
      DB_USER: quota
      DB_PASSWORD: quota
    ports:
      - "8080:8080"
    depends_on:
      - db

  frontend:
    build: ./frontend
    ports:
      - "8081:80"
    depends_on:
      - backend

volumes:
  pgdata:
